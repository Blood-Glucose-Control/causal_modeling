[project]
name = "counterfactual-recurrent-network"
version = "2.0.0"
description = "Counterfactual Recurrent Network (CRN) for estimating treatment outcomes over time - PyTorch implementation"
authors = [
    {name = "Ioana Bica", email = "ioana.bica95@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[tool.black]
line-length = 120
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 120
