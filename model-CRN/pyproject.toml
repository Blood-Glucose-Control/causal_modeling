[project]
name = "crn-model"
version = "0.1.0"
description = "Counterfactual Recurrent Network (CRN) model for causal inference"
authors = [
    {name = "Author", email = "author@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8,<3.13"
dependencies = [
    "numpy>=1.18.2,<2.0",
    "pandas>=1.0.4",
    "scipy>=1.1.0",
    "scikit-learn>=0.22.2",
    "tensorflow>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [] 